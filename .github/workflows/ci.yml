name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[youtube,shell,mcp,dev]"
          python -m playwright install --with-deps chromium
      - name: Test
        run: pytest

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/autotok --version
          /tmp/wheel-env/bin/python -c "import autotok, pathlib; assert (pathlib.Path(autotok.__file__).parent / 'signer_js' / 'xbogus.js').is_file()"

  js:
    name: Node.js ${{ matrix.node-version }} package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: Pack and smoke-test the package
        run: |
          npm pack
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/js/autotok-*.tgz
          test -f node_modules/autotok/signer_js/xbogus.js
          node --input-type=module -e "import { VERSION, Proxy } from 'autotok'; console.log(VERSION, Proxy.parse('h.example:1').url)"
          node -e "console.log(typeof require('autotok').uploadVideo)"

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CLI image (full and slim)
        run: |
          docker build -t autotok:ci .
          docker build --build-arg INSTALL_BROWSER=false -t autotok:ci-slim .
      - name: Smoke-test the CLI image
        run: |
          docker run --rm autotok:ci --version
          docker run --rm autotok:ci browser check
          docker run --rm autotok:ci-slim --version
          docker run --rm -e AUTOTOK_BROWSER=steel autotok:ci-slim install-browser
      - name: Build the web app stack
        run: docker compose build

  webapp:
    name: Web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
