server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Videos are uploaded through /api (nginx's default limit is 1 MB).
    client_max_body_size 2g;

    # Static Vite bundle
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API calls to the FastAPI container.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # "Upload now" waits for TikTok to finish; don't cut it off early.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE needs buffering OFF or the client sees silence until nginx's buffer
    # fills up. Applies to the login events endpoint specifically.
    location ~ ^/api/login/browser/.*/events$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # The VNC server behind noVNC has no password. Before opening its websocket, ask the API
    # whether this page may connect: it checks the Host and Origin headers (so other web pages
    # can't) and that a login is in progress.
    location = /_vnc_auth {
        internal;
        proxy_pass http://api:8000/api/login/browser/vnc-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # With the port: the API compares it to the page's Origin.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    # noVNC's page and scripts — the user's browser loads them in an iframe. websockify accepts a
    # websocket on any path, so none is allowed here: the websocket has its own, checked,
    # locations below.
    location /novnc/ {
        if ($http_upgrade) {
            return 403;
        }
        proxy_pass http://novnc:6080/;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # The websocket itself, at the path vnc_url points to and under /novnc/.
    location /novnc/websockify {
        auth_request /_vnc_auth;
        proxy_pass http://novnc:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /websockify {
        auth_request /_vnc_auth;
        proxy_pass http://novnc:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
